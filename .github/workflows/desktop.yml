name: Desktop build

# PyInstaller cannot cross-compile, so the .app is built on a macOS runner and the .exe on
# a Windows one. This workflow is the only place the Windows build actually happens —
# nothing in the repo can produce it from a Mac.
#
# Neither the .pth checkpoint (183 MB) nor the exported onnx/ (192 MB) is in git, so each
# job downloads the upstream checkpoint and exports the graphs itself. That makes the
# model in a build traceable to a specific upstream release rather than to a blob someone
# once committed.
#
# macOS builds are Apple Silicon only. The macos-14 runner is arm64 and PyInstaller
# packages for the machine it runs on, so an Intel Mac cannot run the result — which is
# why the filename says arm64 rather than leaving someone to discover it after
# downloading 245 MB.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write        # required to attach files to a release

env:
  CHECKPOINT_URL: https://github.com/clovaai/dmfont/releases/download/v1.0.0/korean-handwriting.pth

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            bundle: dist/Soul Font.app
          - os: windows-latest
            platform: windows-x64
            bundle: dist/SoulFont
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # The version people will read off the filename months later. A tag gives the real
      # one; a manual run gets a dev marker with the commit, so a hand-triggered build can
      # never be mistaken for a release.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      # torch is needed to export the graphs and to verify them, but is excluded from the
      # bundle itself — that exclusion is what makes it ~310 MB smaller.
      - name: Install torch (export and verification only)
        run: pip install torch==2.7.1 torchvision==0.22.1

      - name: Cache the checkpoint
        id: ckpt
        uses: actions/cache@v4
        with:
          path: soulfont/checkpoints
          key: dmfont-korean-handwriting-v1.0.0

      - name: Download the checkpoint
        if: steps.ckpt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p soulfont/checkpoints
          curl -L --fail -o soulfont/checkpoints/korean-handwriting.pth "$CHECKPOINT_URL"

      - name: Export ONNX
        working-directory: soulfont
        run: python scripts/export_onnx.py

      - name: Verify ONNX matches PyTorch
        working-directory: soulfont
        run: python scripts/verify_onnx.py

      - name: Collect static files
        working-directory: soulfont
        env:
          SOULFONT_APP: '1'
          SOULFONT_DATA_DIR: ${{ runner.temp }}/soulfont-data
        run: python manage.py collectstatic --noinput

      - name: Build
        run: pyinstaller packaging/soulfont.spec --noconfirm

      - name: Smoke test the bundle
        shell: bash
        run: python packaging/smoke_test.py "${{ matrix.bundle }}"

      # A .app is 161 symlinks and an executable bit, and a zip preserves neither, so the
      # download would not launch. A DMG is what macOS distributes in anyway.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp -R "dist/Soul Font.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Soul Font" -srcfolder staging -ov -format UDZO \
            "SoulFont-${{ steps.version.outputs.value }}-${{ matrix.platform }}.dmg"

      # Windows has no permission bits or symlinks to lose, so a plain zip is enough.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/SoulFont/* `
            -DestinationPath "SoulFont-${{ steps.version.outputs.value }}-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SoulFont-${{ matrix.platform }}
          path: SoulFont-${{ steps.version.outputs.value }}-${{ matrix.platform }}.*
          if-no-files-found: error

  # Both packages have to exist before checksums can be written, and one SHA256SUMS.txt
  # covering everything is the convention — a per-file checksum next to each download is
  # more files to lose track of and no more useful.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Checksums
        working-directory: packages
        run: |
          sha256sum SoulFont-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          body_path: packaging/release-notes.md
          generate_release_notes: true      # appends the commit log under the notes
          fail_on_unmatched_files: true
